services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: sqlite:///./dengdeng.db
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    environment:
      VITE_API: http://backend:8000
    depends_on:
      - backend
